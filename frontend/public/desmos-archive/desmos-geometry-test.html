<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desmos Geometry Test Dashboard · SOL v0</title>
  <style>
    :root {
      --bg:        #0d0f18;
      --surface:   #161927;
      --surface2:  #1e2235;
      --border:    rgba(255,255,255,0.07);
      --text:      #e0e4f0;
      --muted:     #7a82a0;
      --accent:    #007AFF;
      --green:     #34C759;
      --red:       #FF3B30;
      --orange:    #FF9500;
      --purple:    #AF52DE;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      font-size: 13px; min-height: 100vh;
    }
    header {
      position: sticky; top: 0; z-index: 200;
      background: rgba(13,15,24,0.96); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .hdr-inner {
      max-width: 1640px; margin: 0 auto; padding: 0 24px;
      height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .hdr-title { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
    .hdr-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .hdr-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .hdr-progress {
      max-width: 1640px; margin: 0 auto; padding: 0 24px 10px;
      display: flex; align-items: center; gap: 12px;
    }
    #progress-bar { flex: 1; height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
    #progress-fill { height: 100%; width: 0; background: var(--green); border-radius: 2px; transition: width .4s; }
    #progress-text { font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; min-width: 90px; text-align: right; }

    .btn {
      padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 700;
      cursor: pointer; border: none; transition: all .15s; letter-spacing: .2px;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:not(:disabled):hover { background: #0065d8; }
    .btn-ghost { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); }
    .btn-xs { padding: 3px 8px; font-size: 10px; border-radius: 5px; }

    #filters {
      max-width: 1640px; margin: 0 auto; padding: 10px 24px;
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    }
    .filter-label { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .8px; text-transform: uppercase; margin-right: 4px; }
    .filter-btn {
      padding: 3px 11px; border-radius: 20px; font-size: 11px; font-weight: 700;
      cursor: pointer; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted); transition: all .15s;
    }
    .filter-btn.active { border-color: transparent; color: #fff; }
    .filter-btn:not(.active):hover { color: var(--text); }

    #stats-row {
      max-width: 1640px; margin: 0 auto; padding: 0 24px 14px;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .stat-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 11px; border-radius: 8px; background: var(--surface2);
      font-size: 11px; font-weight: 700; color: var(--muted);
    }
    .stat-dot { width: 7px; height: 7px; border-radius: 50%; }

    #grid {
      max-width: 1640px; margin: 0 auto; padding: 0 24px 60px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(370px, 1fr)); gap: 14px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; transition: border-color .2s;
    }
    .card.filtered-out { display: none; }
    .card.status-pass  { border-color: rgba(52,199,89,.25); }
    .card.status-fail  { border-color: rgba(255,59,48,.25); }
    .card.status-running { border-color: rgba(0,122,255,.3); }

    .card-header {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px; border-bottom: 1px solid var(--border); min-height: 38px;
    }
    .cat-badge {
      padding: 2px 7px; border-radius: 10px;
      font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; flex-shrink: 0;
    }
    .card-label {
      flex: 1; font-size: 12px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status-icon { font-size: 14px; flex-shrink: 0; min-width: 18px; text-align: center; }

    .calc-wrap { width: 100%; height: 260px; position: relative; background: #fff; }
    .calc-placeholder {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; gap: 8px; font-size: 11px; font-weight: 700;
      color: #aab; letter-spacing: .5px; text-transform: uppercase; background: #f9fafb;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px; height: 16px; border: 2px solid rgba(0,122,255,.2);
      border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
    }

    .card-footer { padding: 9px 12px; border-top: 1px solid var(--border); }
    .note-text { font-size: 10px; color: var(--muted); line-height: 1.5; }
    .error-msg { font-size: 10px; color: var(--red); margin-top: 4px; display: none; }
    .timing    { font-size: 10px; color: var(--muted); margin-top: 3px; }
    .expr-list {
      margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px;
    }
    .expr-tag {
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 9px;
      background: var(--surface2); border-radius: 4px; padding: 2px 6px; color: #9bf;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
  </style>
</head>
<body>

<header>
  <div class="hdr-inner">
    <div>
      <div class="hdr-title">Desmos Geometry Test Dashboard</div>
      <div class="hdr-sub">v1.12 · Desmos.Geometry() API · SOL v0 · 32 tests</div>
    </div>
    <div class="hdr-actions">
      <div class="stat-chip" style="margin-right:4px">
        <span id="hdr-pass" style="color:var(--green)">0</span>
        <span style="color:var(--muted)">/ <span id="hdr-total">—</span> passed</span>
      </div>
      <button class="btn btn-ghost btn-xs" onclick="clearAll()">Clear</button>
      <button class="btn btn-primary" id="run-all-btn" onclick="runAll()">▶ Run All</button>
    </div>
  </div>
  <div class="hdr-progress">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-text">Idle</div>
  </div>
</header>

<div id="filters">
  <span class="filter-label">Filter</span>
  <button class="filter-btn active" data-cat="all"             onclick="filterCat('all')">All</button>
  <button class="filter-btn" data-cat="Points"                 onclick="filterCat('Points')">Points</button>
  <button class="filter-btn" data-cat="Triangles"              onclick="filterCat('Triangles')">Triangles</button>
  <button class="filter-btn" data-cat="Quadrilaterals"         onclick="filterCat('Quadrilaterals')">Quadrilaterals</button>
  <button class="filter-btn" data-cat="Circles"                onclick="filterCat('Circles')">Circles</button>
  <button class="filter-btn" data-cat="Lines & Angles"         onclick="filterCat('Lines & Angles')">Lines &amp; Angles</button>
  <button class="filter-btn" data-cat="Transformations"        onclick="filterCat('Transformations')">Transforms</button>
  <button class="filter-btn" data-cat="Advanced"               onclick="filterCat('Advanced')">Advanced</button>
</div>

<div id="stats-row">
  <div class="stat-chip"><div class="stat-dot" style="background:#555"></div><span id="stat-pending">— pending</span></div>
  <div class="stat-chip"><div class="stat-dot" style="background:var(--green)"></div><span id="stat-pass">0 passed</span></div>
  <div class="stat-chip"><div class="stat-dot" style="background:var(--red)"></div><span id="stat-fail">0 failed</span></div>
  <div class="stat-chip" style="margin-left:auto;font-weight:400;color:var(--muted)">Desmos.Geometry() — static constructions, no API</div>
</div>

<div id="grid"></div>

<script src="https://www.desmos.com/api/v1.12/calculator.js?apiKey=9299ac9714cd4f159e4a6a40b9c8e4a2"></script>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// CATEGORY COLORS
// ═══════════════════════════════════════════════════════════════════════════
const CAT_META = {
  'Points':           { color: '#6042a6', rgb: [96,66,166]   },
  'Triangles':        { color: '#2d70b3', rgb: [45,112,179]  },
  'Quadrilaterals':   { color: '#fa7e19', rgb: [250,126,25]  },
  'Circles':          { color: '#388c46', rgb: [56,140,70]   },
  'Lines & Angles':   { color: '#c74440', rgb: [199,68,64]   },
  'Transformations':  { color: '#AF52DE', rgb: [175,82,222]  },
  'Advanced':         { color: '#007AFF', rgb: [0,122,255]   },
};

// ═══════════════════════════════════════════════════════════════════════════
// TESTS
// exprs  : array of { latex, color?, showLabel?, lineStyle?, fill?, fillOpacity? }
// bounds : { left, right, bottom, top }
// note   : text shown in card footer
// ═══════════════════════════════════════════════════════════════════════════
const TESTS = [

  // ── 1. POINTS & SEGMENTS ────────────────────────────────────────────────
  {id:'ps1', cat:'Points', label:'Three labeled points',
   exprs:[
     {latex:'A=(1,4)',  showLabel:true, color:'#6042a6'},
     {latex:'B=(7,1)',  showLabel:true, color:'#6042a6'},
     {latex:'C=(5,7)',  showLabel:true, color:'#6042a6'},
   ],
   bounds:{left:0,right:9,bottom:0,top:9},
   note:'Labeled points are defined as variables in Desmos. showLabel reveals coordinates. Foundation of all geometry constructions.',
  },

  {id:'ps2', cat:'Points', label:'Segment + labeled midpoint',
   exprs:[
     {latex:'A=(1,1)',  showLabel:true, color:'#c74440'},
     {latex:'B=(7,5)',  showLabel:true, color:'#c74440'},
     {latex:'\\operatorname{polygon}(A,B)', color:'#2d70b3'},
     {latex:'M=(4,3)',  showLabel:true, color:'#388c46'},
   ],
   bounds:{left:0,right:9,bottom:0,top:7},
   note:'Midpoint M = ((x₁+x₂)/2, (y₁+y₂)/2) = (4,3). Green point bisects segment AB.',
  },

  {id:'ps3', cat:'Points', label:'Four points on a circle (concyclic)',
   exprs:[
     {latex:'x^2+y^2=25',  color:'#388c46'},
     {latex:'O=(0,0)',     showLabel:true, color:'#6042a6'},
     {latex:'A=(5,0)',     showLabel:true, color:'#c74440'},
     {latex:'B=(0,5)',     showLabel:true, color:'#c74440'},
     {latex:'C=(-5,0)',    showLabel:true, color:'#c74440'},
     {latex:'D=(0,-5)',    showLabel:true, color:'#c74440'},
   ],
   bounds:{left:-6.5,right:6.5,bottom:-6.5,top:6.5},
   note:'Four concyclic points A,B,C,D all satisfy x²+y²=25 (radius 5). Center O at origin.',
  },

  {id:'ps4', cat:'Points', label:'Distance formula — two points',
   exprs:[
     {latex:'A=(1,2)',    showLabel:true, color:'#6042a6'},
     {latex:'B=(7,6)',    showLabel:true, color:'#6042a6'},
     {latex:'\\operatorname{polygon}(A,B)', color:'#2d70b3'},
     {latex:'H=(7,2)',    showLabel:true, color:'#c74440'},
     {latex:'\\operatorname{polygon}(B,H)', color:'#c74440'},
     {latex:'\\operatorname{polygon}(A,H)', color:'#c74440'},
   ],
   bounds:{left:0,right:9,bottom:1,top:8},
   note:'d = √((7−1)²+(6−2)²) = √(36+16) = √52 ≈ 7.21. Right triangle shows horizontal leg=6, vertical leg=4.',
  },

  // ── 2. TRIANGLES ────────────────────────────────────────────────────────
  {id:'tr1', cat:'Triangles', label:'Scalene triangle — labeled vertices',
   exprs:[
     {latex:'A=(0,0)',  showLabel:true, color:'#6042a6'},
     {latex:'B=(8,0)',  showLabel:true, color:'#6042a6'},
     {latex:'C=(3,6)',  showLabel:true, color:'#6042a6'},
     {latex:'\\operatorname{polygon}(A,B,C)', color:'#2d70b3', fill:true, fillOpacity:0.08},
   ],
   bounds:{left:-1,right:10,bottom:-1,top:8},
   note:'Scalene triangle: all sides have different lengths. Labeled vertices A, B, C. fill:true adds blue tint.',
  },

  {id:'tr2', cat:'Triangles', label:'3-4-5 right triangle — all angles labeled',
   exprs:[
     {latex:'A=(0,0)',  showLabel:true, color:'#6042a6'},
     {latex:'B=(4,0)',  showLabel:true, color:'#6042a6'},
     {latex:'C=(0,3)',  showLabel:true, color:'#6042a6'},
     {latex:'\\operatorname{polygon}(A,B,C)', color:'#2d70b3', fill:true, fillOpacity:0.1},
     // right-angle box at A
     {latex:'\\operatorname{polygon}((0.35,0),(0.35,0.35),(0,0.35))', color:'#333'},
     // arc at B (≈37°): sweep from direction-to-C (2.498 rad) to direction-to-A (π)
     {latex:'(4+0.55\\cos t, 0.55\\sin t)', color:'#c74440', parametricDomain:{min:'2.498',max:'3.14159'}},
     {latex:'L_{B}=(3.35,0.40)', showLabel:true, label:'37°', color:'#c74440'},
     // arc at C (≈53°): sweep from direction-to-A (−π/2) to direction-to-B (−0.644 rad)
     {latex:'(0.55\\cos t, 3+0.55\\sin t)', color:'#388c46', parametricDomain:{min:'-1.5708',max:'-0.6435'}},
     {latex:'L_{C}=(0.48,2.35)', showLabel:true, label:'53°', color:'#388c46'},
   ],
   bounds:{left:-0.5,right:5.5,bottom:-0.5,top:4.5},
   note:'Right-angle box at A. Arc at B (red) = 37°. Arc at C (green) = 53°. 90+37+53 = 180° ✓',
  },

  {id:'tr3', cat:'Triangles', label:'Equilateral triangle — 60° at every vertex',
   exprs:[
     {latex:'A=(0,0)',       showLabel:true, color:'#6042a6'},
     {latex:'B=(6,0)',       showLabel:true, color:'#6042a6'},
     {latex:'C=(3,5.196)',   showLabel:true, color:'#6042a6'},
     {latex:'\\operatorname{polygon}(A,B,C)', color:'#388c46', fill:true, fillOpacity:0.08},
     // arc at A: 0 → π/3 (60°)
     {latex:'(0.8\\cos t, 0.8\\sin t)',          color:'#c74440', parametricDomain:{min:'0',      max:'1.0472'}},
     {latex:'L_{A}=(1.1,0.35)',  showLabel:true, label:'60°', color:'#c74440'},
     // arc at B: 2π/3 → π (120°→180°)
     {latex:'(6+0.8\\cos t, 0.8\\sin t)',        color:'#c74440', parametricDomain:{min:'2.0944', max:'3.14159'}},
     {latex:'L_{B}=(4.85,0.35)', showLabel:true, label:'60°', color:'#c74440'},
     // arc at C: −2π/3 → −π/3 (pointing down toward interior)
     {latex:'(3+0.8\\cos t, 5.196+0.8\\sin t)', color:'#c74440', parametricDomain:{min:'-2.0944',max:'-1.0472'}},
     {latex:'L_{C}=(3,4.25)',    showLabel:true, label:'60°', color:'#c74440'},
   ],
   bounds:{left:-1,right:7.5,bottom:-1,top:6.5},
   note:'Equilateral triangle: all sides = 6. Red arc arcs at A, B, C each measure 60°. 60+60+60 = 180° ✓',
  },

  {id:'tr4', cat:'Triangles', label:'Triangle with altitude — right angle at foot',
   exprs:[
     {latex:'A=(1,0)',  showLabel:true, color:'#6042a6'},
     {latex:'B=(7,0)',  showLabel:true, color:'#6042a6'},
     {latex:'C=(3,5)',  showLabel:true, color:'#6042a6'},
     {latex:'\\operatorname{polygon}(A,B,C)', color:'#2d70b3', fill:true, fillOpacity:0.08},
     {latex:'F=(3,0)',  showLabel:true, color:'#c74440'},
     {latex:'\\operatorname{polygon}(C,F)', color:'#c74440'},
     // right-angle box at F: legs go right (+x) and up (+y) from F=(3,0)
     {latex:'\\operatorname{polygon}((3.4,0),(3.4,0.4),(3,0.4))', color:'#333'},
     {latex:'L_{F}=(3.55,0.55)', showLabel:true, label:'90°', color:'#333'},
   ],
   bounds:{left:0,right:9,bottom:-0.5,top:6.5},
   note:'Altitude CF ⊥ AB. Right-angle box at foot F. Area = ½ × base × height = ½ × 6 × 5 = 15.',
  },

  {id:'tr5', cat:'Triangles', label:'Isosceles triangle + axis of symmetry',
   exprs:[
     {latex:'A=(0,0)',  showLabel:true, color:'#6042a6'},
     {latex:'B=(8,0)',  showLabel:true, color:'#6042a6'},
     {latex:'C=(4,5)',  showLabel:true, color:'#6042a6'},
     {latex:'\\operatorname{polygon}(A,B,C)', color:'#c74440', fill:true, fillOpacity:0.08},
     {latex:'x=4', color:'#888', lineStyle:'DASHED'},
   ],
   bounds:{left:-1,right:9.5,bottom:-1,top:6.5},
   note:'Isosceles: AC=BC (both equal). Dashed line x=4 is the axis of symmetry through C and midpoint of AB.',
  },

  {id:'tr6', cat:'Triangles', label:'Right triangle + circumscribed circle',
   exprs:[
     {latex:'A=(0,0)',  showLabel:true, color:'#6042a6'},
     {latex:'B=(6,0)',  showLabel:true, color:'#6042a6'},
     {latex:'C=(0,6)',  showLabel:true, color:'#6042a6'},
     {latex:'\\operatorname{polygon}(A,B,C)', color:'#2d70b3', fill:true, fillOpacity:0.06},
     {latex:'(x-3)^2+(y-3)^2=18', color:'#388c46'},
     {latex:'O=(3,3)',  showLabel:true, color:'#388c46'},
   ],
   bounds:{left:-5.5,right:10,bottom:-5.5,top:10},
   note:"Thales' theorem: right angle subtended by diameter. Circumcenter O = midpoint of hypotenuse (3,3). r=3√2≈4.24.",
  },

  // ── 3. QUADRILATERALS ───────────────────────────────────────────────────
  {id:'qu1', cat:'Quadrilaterals', label:'Rectangle ABCD',
   exprs:[
     {latex:'A=(0,0)', showLabel:true, color:'#6042a6'},
     {latex:'B=(7,0)', showLabel:true, color:'#6042a6'},
     {latex:'C=(7,4)', showLabel:true, color:'#6042a6'},
     {latex:'D=(0,4)', showLabel:true, color:'#6042a6'},
     {latex:'\\operatorname{polygon}(A,B,C,D)', color:'#2d70b3', fill:true, fillOpacity:0.08},
   ],
   bounds:{left:-1,right:9,bottom:-1,top:5.5},
   note:'Rectangle: length=7, width=4, perimeter=22, area=28. All angles 90°. Opposite sides parallel and equal.',
  },

  {id:'qu2', cat:'Quadrilaterals', label:'Parallelogram + diagonals',
   exprs:[
     {latex:'A=(0,0)', showLabel:true, color:'#6042a6'},
     {latex:'B=(5,0)', showLabel:true, color:'#6042a6'},
     {latex:'C=(7,3)', showLabel:true, color:'#6042a6'},
     {latex:'D=(2,3)', showLabel:true, color:'#6042a6'},
     {latex:'\\operatorname{polygon}(A,B,C,D)', color:'#fa7e19', fill:true, fillOpacity:0.08},
     {latex:'\\operatorname{polygon}(A,C)', color:'#c74440', lineStyle:'DASHED'},
     {latex:'\\operatorname{polygon}(B,D)', color:'#6042a6', lineStyle:'DASHED'},
   ],
   bounds:{left:-1,right:9,bottom:-1,top:4.5},
   note:'Parallelogram: opposite sides parallel & equal. Both diagonals shown. Diagonals bisect each other (meet at midpoint).',
  },

  {id:'qu3', cat:'Quadrilaterals', label:'Trapezoid — parallel sides',
   exprs:[
     {latex:'A=(0,0)', showLabel:true, color:'#6042a6'},
     {latex:'B=(8,0)', showLabel:true, color:'#6042a6'},
     {latex:'C=(6,4)', showLabel:true, color:'#6042a6'},
     {latex:'D=(2,4)', showLabel:true, color:'#6042a6'},
     {latex:'\\operatorname{polygon}(A,B,C,D)', color:'#fa7e19', fill:true, fillOpacity:0.1},
   ],
   bounds:{left:-1,right:10,bottom:-1,top:5.5},
   note:'Trapezoid: AB ∥ DC (both horizontal). Parallel sides: AB=8, DC=4. Midsegment = (8+4)/2 = 6.',
  },

  {id:'qu4', cat:'Quadrilaterals', label:'Rhombus — perpendicular diagonals',
   exprs:[
     {latex:'A=(4,0)',    showLabel:true, color:'#6042a6'},
     {latex:'B=(0,3)',    showLabel:true, color:'#6042a6'},
     {latex:'C=(-4,0)',   showLabel:true, color:'#6042a6'},
     {latex:'D=(0,-3)',   showLabel:true, color:'#6042a6'},
     {latex:'\\operatorname{polygon}(A,B,C,D)', color:'#fa7e19', fill:true, fillOpacity:0.1},
     {latex:'\\operatorname{polygon}(A,C)', color:'#888', lineStyle:'DASHED'},
     {latex:'\\operatorname{polygon}(B,D)', color:'#888', lineStyle:'DASHED'},
   ],
   bounds:{left:-5.5,right:5.5,bottom:-4.5,top:4.5},
   note:'Rhombus: all sides = 5. Diagonals (8 and 6) cross at 90° and bisect each other. Area = ½d₁d₂ = ½(8)(6) = 24.',
  },

  {id:'qu5', cat:'Quadrilaterals', label:'Regular hexagon (6 vertices)',
   exprs:[
     {latex:'A=(4,0)',     showLabel:true, color:'#6042a6'},
     {latex:'B=(2,3.46)',  showLabel:true, color:'#6042a6'},
     {latex:'C=(-2,3.46)', showLabel:true, color:'#6042a6'},
     {latex:'D=(-4,0)',    showLabel:true, color:'#6042a6'},
     {latex:'E=(-2,-3.46)',showLabel:true, color:'#6042a6'},
     {latex:'F=(2,-3.46)', showLabel:true, color:'#6042a6'},
     {latex:'\\operatorname{polygon}(A,B,C,D,E,F)', color:'#2d70b3', fill:true, fillOpacity:0.06},
   ],
   bounds:{left:-6,right:6,bottom:-5.5,top:5.5},
   note:'Regular hexagon: all sides equal, all interior angles = 120°. All vertices lie on circle r=4.',
  },

  // ── 4. CIRCLES ──────────────────────────────────────────────────────────

// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
const geos  = {};   // id → Desmos.Geometry instance
const state = {};   // id → { status, ms, error }
TESTS.forEach(t => { state[t.id] = { status: 'pending' }; });

// ═══════════════════════════════════════════════════════════════════════════
// CARD BUILDING
// ═══════════════════════════════════════════════════════════════════════════
function buildCards() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  TESTS.forEach(t => {
    const meta = CAT_META[t.cat] || { color: '#555' };
    const [r, g, b] = (CAT_META[t.cat] || { rgb: [85,85,85] }).rgb;

    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${t.id}`;

    card.innerHTML = `
      <div class="card-header">
        <span class="cat-badge" style="background:rgba(${r},${g},${b},0.18);color:rgba(${r},${g},${b},1)">${t.cat}</span>
        <span class="card-label" title="${t.label}">${t.label}</span>
        <span class="status-icon" id="icon-${t.id}">○</span>
      </div>
      <div class="calc-wrap" id="wrap-${t.id}">
        <div class="calc-placeholder">Ready</div>
      </div>
      <div class="card-footer">
        <div class="note-text">${t.note}</div>
        <div class="expr-list" id="exprs-${t.id}"></div>
        <div class="error-msg" id="err-${t.id}"></div>
        <div class="timing" id="ms-${t.id}"></div>
      </div>
    `;
    grid.appendChild(card);
  });
  updateStats();
  document.getElementById('hdr-total').textContent = TESTS.length;
}

// ═══════════════════════════════════════════════════════════════════════════
// STATUS HELPERS
// ═══════════════════════════════════════════════════════════════════════════
const STATUS_ICON = { pending:'○', running:'◉', pass:'✓', fail:'✗' };
const STATUS_COLOR = { pending:'#666', running:'var(--accent)', pass:'var(--green)', fail:'var(--red)' };

function setCardStatus(id, status, errMsg) {
  const card = document.getElementById(`card-${id}`);
  const icon = document.getElementById(`icon-${id}`);
  if (!card) return;
  card.className = `card status-${status}`;
  icon.textContent = STATUS_ICON[status] || '○';
  icon.style.color = STATUS_COLOR[status] || '#666';
  state[id].status = status;
  if (errMsg) {
    const errEl = document.getElementById(`err-${id}`);
    errEl.textContent = errMsg;
    errEl.style.display = 'block';
  }
  updateStats();
}

function updateStats() {
  const counts = { pending:0, pass:0, fail:0, running:0 };
  TESTS.forEach(t => { counts[state[t.id].status] = (counts[state[t.id].status] || 0) + 1; });
  document.getElementById('stat-pending').textContent = `${counts.pending} pending`;
  document.getElementById('stat-pass').textContent    = `${counts.pass} passed`;
  document.getElementById('stat-fail').textContent    = `${counts.fail} failed`;
  document.getElementById('hdr-pass').textContent     = counts.pass;
  const done = counts.pass + counts.fail;
  const pct  = TESTS.length ? Math.round(done / TESTS.length * 100) : 0;
  document.getElementById('progress-fill').style.width = `${pct}%`;
  document.getElementById('progress-text').textContent = done === TESTS.length
    ? `${counts.pass}/${TESTS.length} passed`
    : `${done}/${TESTS.length} done`;
}

// ═══════════════════════════════════════════════════════════════════════════
// DESTROY
// ═══════════════════════════════════════════════════════════════════════════
function destroyGeo(id) {
  if (geos[id]) {
    try { geos[id].destroy(); } catch(e) {}
    delete geos[id];
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// RUN SINGLE TEST
// ═══════════════════════════════════════════════════════════════════════════
async function runTest(id) {
  const test = TESTS.find(t => t.id === id);
  if (!test) return;

  destroyGeo(id);
  setCardStatus(id, 'running');

  const wrap = document.getElementById(`wrap-${id}`);
  wrap.innerHTML = `<div class="calc-placeholder" style="display:flex"><div class="spinner"></div><span>Loading…</span></div>`;
  document.getElementById(`err-${id}`).style.display = 'none';
  document.getElementById(`ms-${id}`).textContent = '';

  const t0 = Date.now();
  try {
    if (!window.Desmos) throw new Error('Desmos API not loaded');

    // Create container
    const container = document.createElement('div');
    container.style.cssText = 'width:100%;height:260px';
    wrap.innerHTML = '';
    wrap.appendChild(container);

    // Instantiate Desmos.Geometry
    const geo = window.Desmos.Geometry(container, {
      settingsMenu:  false,
      zoomButtons:   false,
      border:        false,
      expressions:   false,
      keypad:        false,
      lockViewport:  false,
    });

    // Set viewport
    geo.setMathBounds(test.bounds);

    // Build expression list with sequential IDs
    const toSet = test.exprs.map((e, i) => {
      const expr = {
        type:      'expression',
        id:        `e${i}`,
        latex:     e.latex     ?? '',
        color:     e.color     ?? '#2d70b3',
        showLabel: e.showLabel ?? false,
        hidden:    e.hidden    ?? false,
      };
      if (e.lineStyle    != null) expr.lineStyle    = e.lineStyle;
      if (e.lineWidth    != null) expr.lineWidth    = e.lineWidth;
      if (e.fill         != null) expr.fill         = e.fill;
      if (e.fillOpacity  != null) expr.fillOpacity  = e.fillOpacity;
      if (e.pointStyle        != null) expr.pointStyle        = e.pointStyle;
      if (e.pointSize         != null) expr.pointSize         = e.pointSize;
      if (e.label             != null) expr.label             = e.label;
      if (e.parametricDomain  != null) expr.parametricDomain  = e.parametricDomain;
      return expr;
    });

    // Load expressions after one RAF (let Geometry finish initializing)
    await new Promise(resolve => requestAnimationFrame(resolve));
    geo.setExpressions(toSet);

    // Wait for render
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    // Screenshot for pass/fail detection
    const shot = geo.screenshot({ width: 370, height: 260 });
    const ms = Date.now() - t0;

    // Pass = we got a valid PNG data URI
    const pass = shot && shot.startsWith('data:image/png;base64,');
    geos[id] = geo;
    state[id].ms = ms;

    document.getElementById(`ms-${id}`).textContent = `${ms}ms · ${toSet.length} expr${toSet.length !== 1 ? 's' : ''}`;

    // Show expression tags
    const exprList = document.getElementById(`exprs-${id}`);
    exprList.innerHTML = test.exprs.slice(0, 4).map(e =>
      `<span class="expr-tag">${e.latex.length > 28 ? e.latex.slice(0,28)+'…' : e.latex}</span>`
    ).join('') + (test.exprs.length > 4 ? `<span class="expr-tag">+${test.exprs.length-4} more</span>` : '');

    setCardStatus(id, pass ? 'pass' : 'fail', pass ? undefined : 'screenshot() returned invalid data');

  } catch (err) {
    const ms = Date.now() - t0;
    state[id].ms = ms;
    document.getElementById(`ms-${id}`).textContent = `${ms}ms`;
    setCardStatus(id, 'fail', err.message);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// RUN ALL  (2 concurrent — Geometry instances are heavier than just equations)
// ═══════════════════════════════════════════════════════════════════════════
async function runAll() {
  const btn = document.getElementById('run-all-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Running…';

  const queue = TESTS.map(t => t.id);
  let active = 0;
  const CONCURRENCY = 2;

  await new Promise(resolve => {
    function next() {
      if (queue.length === 0 && active === 0) { resolve(); return; }
      while (queue.length > 0 && active < CONCURRENCY) {
        const id = queue.shift();
        active++;
        runTest(id).finally(() => { active--; next(); });
      }
    }
    next();
  });

  btn.disabled = false;
  btn.textContent = '▶ Run All';
}

// ═══════════════════════════════════════════════════════════════════════════
// CLEAR ALL
// ═══════════════════════════════════════════════════════════════════════════
function clearAll() {
  TESTS.forEach(t => {
    destroyGeo(t.id);
    state[t.id] = { status: 'pending' };
  });
  buildCards();
}

function filterCat(cat) {
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('active');
    b.style.background = '';
    b.style.color = '';
  });
  const active = document.querySelector(`.filter-btn[data-cat="${cat}"]`);
  if (active) {
    active.classList.add('active');
    const meta = cat === 'all' ? null : (CAT_META[cat] || null);
    active.style.background = meta ? meta.color : 'var(--accent)';
    active.style.color = '#fff';
  }
  TESTS.forEach(t => {
    const card = document.getElementById(`card-${t.id}`);
    if (!card) return;
    card.classList.toggle('filtered-out', cat !== 'all' && t.cat !== cat);
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
buildCards();
document.querySelector('.filter-btn[data-cat="all"]').style.background = 'var(--accent)';
document.querySelector('.filter-btn[data-cat="all"]').style.color = '#fff';
</script>
</body>
